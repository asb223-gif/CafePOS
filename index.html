<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카페 POS</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #f3f4f1;
    color: #222;
}

header {
    background: #20382c;
    color: white;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 26px;
    font-weight: 800;
}

.sales-label {
    font-size: 13px;
    opacity: .7;
    text-align: right;
}

.sales-money {
    font-size: 28px;
    font-weight: 800;
}

.main {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1.05fr;
    gap: 18px;
}

.panel {
    background: white;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,.05);
}

h2 {
    margin: 0 0 17px;
    font-size: 21px;
}

.menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.menu-button {
    border: 2px solid #e3e5e1;
    border-radius: 17px;
    background: white;
    min-height: 105px;
    padding: 17px;
    text-align: left;
    cursor: pointer;
    transition: .1s;
}

.menu-button:active {
    transform: scale(.97);
    background: #e7f0eb;
    border-color: #47705b;
}

.menu-name {
    font-size: 19px;
    font-weight: 800;
}

.menu-temp {
    margin-top: 7px;
    font-size: 14px;
    color: #777;
}

.menu-price {
    margin-top: 7px;
    font-size: 17px;
    font-weight: 700;
}

.ice { color: #3172a8; }
.hot { color: #b4543f; }

.order-empty {
    color: #999;
    text-align: center;
    padding: 55px 0;
}

.order-item {
    border: 2px solid #eeeeeb;
    border-radius: 15px;
    padding: 14px;
    margin-bottom: 10px;
}

.order-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
}

.order-name {
    font-size: 17px;
    font-weight: 800;
}

.order-price {
    font-size: 18px;
    font-weight: 800;
}

.order-bottom {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.discount-select {
    flex: 1;
    padding: 11px;
    border: 1px solid #d9ddd8;
    border-radius: 10px;
    background: #f8f9f7;
    font-size: 14px;
    font-weight: 600;
}

.qty {
    display: flex;
    align-items: center;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.qty button {
    width: 37px;
    height: 39px;
    border: 0;
    background: #f2f3f1;
    font-size: 20px;
    cursor: pointer;
}

.qty span {
    width: 35px;
    text-align: center;
    font-weight: 800;
}

.delete {
    border: 0;
    background: #f5e7e7;
    color: #a33e3e;
    border-radius: 10px;
    height: 39px;
    padding: 0 12px;
    cursor: pointer;
}

.total-area {
    margin-top: 20px;
    border-top: 2px solid #eee;
    padding-top: 18px;
}

.total {
    display: flex;
    justify-content: space-between;
    font-size: 23px;
    font-weight: 900;
}

.checkout {
    width: 100%;
    margin-top: 17px;
    padding: 19px;
    border: 0;
    border-radius: 14px;
    background: #17261f;
    color: white;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
}

.history-container {
    max-width: 1400px;
    margin: 0 auto 30px;
    padding: 0 20px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding: 13px 0;
}

.history-time {
    color: #999;
    font-size: 13px;
    margin-top: 4px;
}

.reset {
    border: 0;
    border-radius: 9px;
    padding: 9px 12px;
    background: #eee;
    cursor: pointer;
}

.toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    background: #18271f;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: .2s;
}

.toast.show {
    opacity: 1;
}

@media(max-width:800px) {
    .main {
        grid-template-columns: 1fr;
        padding: 12px;
    }

    header {
        padding: 17px;
    }

    .menu-button {
        min-height: 95px;
        padding: 13px;
    }

    .menu-name {
        font-size: 17px;
    }

    .order-bottom {
        flex-wrap: wrap;
    }

    .discount-select {
        min-width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">☕ 카페 POS</div>

    <div>
        <div class="sales-label">오늘 총매출</div>
        <div class="sales-money" id="todaySales">0원</div>
    </div>
</header>

<div class="main">

    <!-- 메뉴 -->
    <div class="panel">

        <h2>메뉴</h2>

        <div class="menu-grid">

            <button class="menu-button"
                onclick="addItem('아메리카노','ICE',4000)">
                <div class="menu-name">☕ 아메리카노</div>
                <div class="menu-temp ice">🧊 ICE</div>
                <div class="menu-price">4,000원</div>
            </button>

            <button class="menu-button"
                onclick="addItem('아메리카노','HOT',4000)">
                <div class="menu-name">☕ 아메리카노</div>
                <div class="menu-temp hot">🔥 HOT</div>
                <div class="menu-price">4,000원</div>
            </button>

            <button class="menu-button"
                onclick="addItem('카페라떼','ICE',4500)">
                <div class="menu-name">🥛 카페라떼</div>
                <div class="menu-temp ice">🧊 ICE</div>
                <div class="menu-price">4,500원</div>
            </button>

            <button class="menu-button"
                onclick="addItem('카페라떼','HOT',4500)">
                <div class="menu-name">🥛 카페라떼</div>
                <div class="menu-temp hot">🔥 HOT</div>
                <div class="menu-price">4,500원</div>
            </button>

            <button class="menu-button"
                onclick="addItem('한방차','',9000)">
                <div class="menu-name">🍵 한방차</div>
                <div class="menu-temp">따뜻한 차</div>
                <div class="menu-price">9,000원</div>
            </button>

        </div>

    </div>

    <!-- 현재 주문 -->
    <div class="panel">

        <h2>현재 주문</h2>

        <div id="orderList"></div>

        <div class="total-area">

            <div class="total">
                <span>결제금액</span>
                <span id="total">0원</span>
            </div>

            <button class="checkout" onclick="checkout()">
                주문 완료
            </button>

        </div>

    </div>

</div>

<div class="history-container">

    <div class="panel">

        <div class="history-header">

            <h2>오늘 주문 내역</h2>

            <button class="reset" onclick="resetToday()">
                오늘 기록 초기화
            </button>

        </div>

        <div id="historyList"></div>

    </div>

</div>

<div class="toast" id="toast">메뉴를 추가했습니다</div>

<script>

let currentOrder = [];

function todayKey() {
    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");
}

function getDatabase() {
    return JSON.parse(localStorage.getItem("cafePOS") || "{}");
}

function saveDatabase(db) {
    localStorage.setItem("cafePOS", JSON.stringify(db));
}

function discountRate(type) {

    if(type === "senior") return 0.30;
    if(type === "family") return 0.10;

    return 0;
}

function discountLabel(type) {

    if(type === "senior") return "55세 이상 30%";
    if(type === "family") return "이웃가족 10%";

    return "일반";
}

function calculateUnitPrice(item) {

    const rate = discountRate(item.discount);

    return Math.round(item.basePrice * (1-rate));
}

function addItem(name,temp,price) {

    /*
    같은 메뉴라도 각각 따로 담습니다.
    이렇게 해야 한 잔은 일반,
    한 잔은 30% 할인 적용이 가능합니다.
    */

    currentOrder.push({
        name:name,
        temp:temp,
        basePrice:price,
        discount:"normal",
        qty:1
    });

    renderOrder();
    showToast(name + " " + temp + " 추가");
}

function changeDiscount(index,value) {

    currentOrder[index].discount = value;

    renderOrder();
}

function changeQty(index,amount) {

    currentOrder[index].qty += amount;

    if(currentOrder[index].qty <= 0) {
        currentOrder.splice(index,1);
    }

    renderOrder();
}

function deleteItem(index) {

    currentOrder.splice(index,1);

    renderOrder();
}

function renderOrder() {

    const list = document.getElementById("orderList");

    if(currentOrder.length === 0) {

        list.innerHTML =
            '<div class="order-empty">왼쪽에서 메뉴를 눌러주세요</div>';

        document.getElementById("total").innerText = "0원";

        return;
    }

    list.innerHTML = currentOrder.map((item,index)=>{

        const unitPrice = calculateUnitPrice(item);
        const subtotal = unitPrice * item.qty;

        const tempText =
            item.temp ?
            " · " + item.temp :
            "";

        return `
        <div class="order-item">

            <div class="order-top">

                <div>
                    <div class="order-name">
                        ${item.name}${tempText}
                    </div>

                    <div style="font-size:13px;color:#888;margin-top:4px">
                        ${discountLabel(item.discount)}
                    </div>
                </div>

                <div class="order-price">
                    ${subtotal.toLocaleString()}원
                </div>

            </div>

            <div class="order-bottom">

                <select
                    class="discount-select"
                    onchange="changeDiscount(${index},this.value)">

                    <option value="normal"
                        ${item.discount==="normal" ? "selected":""}>
                        일반 가격
                    </option>

                    <option value="senior"
                        ${item.discount==="senior" ? "selected":""}>
                        55세 이상 · 30% 할인
                    </option>

                    <option value="family"
                        ${item.discount==="family" ? "selected":""}>
                        이웃가족 · 10% 할인
                    </option>

                </select>

                <div class="qty">

                    <button onclick="changeQty(${index},-1)">
                        −
                    </button>

                    <span>${item.qty}</span>

                    <button onclick="changeQty(${index},1)">
                        +
                    </button>

                </div>

                <button
                    class="delete"
                    onclick="deleteItem(${index})">
                    삭제
                </button>

            </div>

        </div>
        `;

    }).join("");

    const total = currentOrder.reduce((sum,item)=>{

        return sum +
            calculateUnitPrice(item) * item.qty;

    },0);

    document.getElementById("total").innerText =
        total.toLocaleString()+"원";
}

function checkout() {

    if(currentOrder.length === 0) {
        alert("주문이 없습니다.");
        return;
    }

    const total = currentOrder.reduce((sum,item)=>{

        return sum +
            calculateUnitPrice(item) * item.qty;

    },0);

    const savedItems = currentOrder.map(item=>({

        name:item.name,
        temp:item.temp,
        qty:item.qty,
        discount:item.discount,
        unitPrice:calculateUnitPrice(item)

    }));

    const db = getDatabase();

    const key = todayKey();

    if(!db[key]) {
        db[key] = [];
    }

    db[key].push({

        time:new Date().toLocaleTimeString("ko-KR",{
            hour:"2-digit",
            minute:"2-digit"
        }),

        total:total,

        items:savedItems

    });

    saveDatabase(db);

    currentOrder = [];

    renderOrder();
    updateToday();

    showToast("주문 완료 ✓");
}

function updateToday() {

    const db = getDatabase();

    const orders = db[todayKey()] || [];

    const sales = orders.reduce(
        (sum,order)=>sum+order.total,
        0
    );

    document.getElementById("todaySales").innerText =
        sales.toLocaleString()+"원";

    const history =
        document.getElementById("historyList");

    if(orders.length === 0) {

        history.innerHTML =
            '<div class="order-empty">오늘 주문 기록이 없습니다</div>';

        return;
    }

    history.innerHTML =
        [...orders].reverse().map(order=>{

            const names = order.items.map(item=>{

                let text =
                    item.name +
                    (item.temp ? " "+item.temp : "");

                if(item.qty > 1) {
                    text += " ×"+item.qty;
                }

                if(item.discount !== "normal") {
                    text +=
                        " (" +
                        discountLabel(item.discount) +
                        ")";
                }

                return text;

            }).join(", ");

            return `
            <div class="history-row">

                <div>

                    <strong>${names}</strong>

                    <div class="history-time">
                        ${order.time}
                    </div>

                </div>

                <strong>
                    ${order.total.toLocaleString()}원
                </strong>

            </div>
            `;

        }).join("");
}

function resetToday() {

    if(!confirm(
        "오늘 주문 기록과 총매출을 모두 초기화할까요?"
    )) {
        return;
    }

    const db = getDatabase();

    delete db[todayKey()];

    saveDatabase(db);

    updateToday();
}

let toastTimer;

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.innerText = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(()=>{
        toast.classList.remove("show");
    },800);
}

renderOrder();
updateToday();

</script>

</body>
</html>

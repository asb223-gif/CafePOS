<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카페 POS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #f4f5f2;
    color: #222;
}

header {
    height: 90px;
    background: #1f3329;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
}

.logo {
    font-size: 27px;
    font-weight: 800;
}

.sales {
    text-align: right;
}

.sales-label {
    font-size: 14px;
    opacity: .75;
}

.sales-money {
    font-size: 28px;
    font-weight: 800;
}

.container {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 20px;
    padding: 20px;
    max-width: 1400px;
    margin: auto;
}

.panel {
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
}

h2 {
    margin: 0 0 18px;
    font-size: 21px;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 14px;
}

.menu {
    border: 2px solid #e5e7e2;
    background: white;
    border-radius: 18px;
    padding: 25px 18px;
    cursor: pointer;
    text-align: left;
    transition: .15s;
}

.menu:hover {
    border-color: #426a54;
    transform: translateY(-2px);
}

.menu-name {
    font-size: 20px;
    font-weight: 800;
}

.menu-price {
    margin-top: 8px;
    color: #777;
    font-size: 16px;
}

.temp-title {
    margin-top: 25px;
}

.temp-buttons,
.discount-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.option {
    flex: 1;
    padding: 15px 8px;
    border-radius: 13px;
    border: 2px solid #e1e3df;
    background: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.option.selected {
    background: #e2eee7;
    border-color: #426a54;
    color: #284534;
}

.add {
    width: 100%;
    margin-top: 22px;
    padding: 18px;
    border: 0;
    border-radius: 15px;
    background: #294b39;
    color: white;
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
}

.add:disabled {
    opacity: .35;
}

.empty {
    color: #999;
    text-align: center;
    padding: 50px 0;
}

.order-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    padding: 15px 0;
}

.order-name {
    font-weight: 700;
}

.order-detail {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

.remove {
    border: 0;
    background: #f3e4e4;
    color: #9a3939;
    border-radius: 9px;
    padding: 8px 10px;
    cursor: pointer;
}

.total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    font-size: 22px;
    font-weight: 800;
}

.checkout {
    width: 100%;
    border: 0;
    border-radius: 15px;
    padding: 19px;
    margin-top: 18px;
    background: #111;
    color: white;
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
}

.history {
    max-width: 1400px;
    margin: 0 auto 30px;
    padding: 0 20px;
}

.history-row {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.history-time {
    color: #888;
    font-size: 13px;
}

.reset {
    border: 0;
    background: #eee;
    padding: 9px 13px;
    border-radius: 9px;
    cursor: pointer;
}

@media (max-width: 800px) {
    .container {
        grid-template-columns: 1fr;
    }

    header {
        padding: 0 18px;
    }

    .menu {
        padding: 20px 13px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">☕ 카페 POS</div>

    <div class="sales">
        <div class="sales-label">오늘 총매출</div>
        <div class="sales-money" id="todaySales">0원</div>
    </div>
</header>

<div class="container">

    <div class="panel">

        <h2>메뉴 선택</h2>

        <div class="menu-grid">

            <button class="menu" onclick="selectMenu('아메리카노',4000,true)">
                <div class="menu-name">☕ 아메리카노</div>
                <div class="menu-price">4,000원</div>
            </button>

            <button class="menu" onclick="selectMenu('카페라떼',4500,true)">
                <div class="menu-name">🥛 카페라떼</div>
                <div class="menu-price">4,500원</div>
            </button>

            <button class="menu" onclick="selectMenu('한방차',9000,false)">
                <div class="menu-name">🍵 한방차</div>
                <div class="menu-price">9,000원</div>
            </button>

        </div>

        <div id="options" style="display:none">

            <h2 class="temp-title" id="selectedTitle"></h2>

            <div id="temperatureArea">
                <div>온도</div>

                <div class="temp-buttons">
                    <button class="option temp" onclick="setTemp('HOT',this)">🔥 HOT</button>
                    <button class="option temp" onclick="setTemp('ICE',this)">🧊 ICE</button>
                </div>
            </div>

            <div style="margin-top:20px">할인</div>

            <div class="discount-buttons">

                <button class="option discount selected"
                onclick="setDiscount('일반',0,this)">
                    일반
                </button>

                <button class="option discount"
                onclick="setDiscount('55세 이상',30,this)">
                    55세 이상<br>30% 할인
                </button>

                <button class="option discount"
                onclick="setDiscount('이웃가족',10,this)">
                    이웃가족<br>10% 할인
                </button>

            </div>

            <button id="addButton" class="add" onclick="addOrder()">
                주문에 담기
            </button>

        </div>

    </div>


    <div class="panel">

        <h2>현재 주문</h2>

        <div id="orderList">
            <div class="empty">메뉴를 선택해주세요</div>
        </div>

        <div class="total">
            <span>결제금액</span>
            <span id="total">0원</span>
        </div>

        <button class="checkout" onclick="checkout()">
            주문 완료
        </button>

    </div>

</div>


<div class="history">

    <div class="panel">

        <div style="display:flex;justify-content:space-between;align-items:center">

            <h2>오늘 주문 내역</h2>

            <button class="reset" onclick="resetToday()">
                오늘 기록 초기화
            </button>

        </div>

        <div id="historyList"></div>

    </div>

</div>


<script>

let selectedMenu = null;
let selectedPrice = 0;
let needsTemperature = true;
let selectedTemp = null;

let discountName = "일반";
let discountPercent = 0;

let currentOrder = [];

function todayKey() {
    const d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0");
}

function getDatabase() {
    return JSON.parse(localStorage.getItem("cafePOS") || "{}");
}

function saveDatabase(db) {
    localStorage.setItem("cafePOS",JSON.stringify(db));
}

function selectMenu(name,price,tempRequired) {

    selectedMenu = name;
    selectedPrice = price;
    needsTemperature = tempRequired;
    selectedTemp = null;

    document.getElementById("options").style.display = "block";

    document.getElementById("selectedTitle").innerText =
        name + " · " + price.toLocaleString() + "원";

    document.getElementById("temperatureArea").style.display =
        tempRequired ? "block" : "none";

    document.querySelectorAll(".temp").forEach(b=>{
        b.classList.remove("selected");
    });

    discountName = "일반";
    discountPercent = 0;

    document.querySelectorAll(".discount").forEach(b=>{
        b.classList.remove("selected");
    });

    document.querySelector(".discount").classList.add("selected");
}

function setTemp(temp,button) {

    selectedTemp = temp;

    document.querySelectorAll(".temp").forEach(b=>{
        b.classList.remove("selected");
    });

    button.classList.add("selected");
}

function setDiscount(name,percent,button) {

    discountName = name;
    discountPercent = percent;

    document.querySelectorAll(".discount").forEach(b=>{
        b.classList.remove("selected");
    });

    button.classList.add("selected");
}

function addOrder() {

    if(!selectedMenu) {
        alert("메뉴를 선택해주세요.");
        return;
    }

    if(needsTemperature && !selectedTemp) {
        alert("HOT 또는 ICE를 선택해주세요.");
        return;
    }

    const finalPrice =
        Math.round(selectedPrice * (1-discountPercent/100));

    currentOrder.push({

        name:selectedMenu,
        temp:needsTemperature ? selectedTemp : "",
        originalPrice:selectedPrice,
        price:finalPrice,
        discount:discountName,
        discountPercent:discountPercent

    });

    renderOrder();
}

function removeOrder(index) {

    currentOrder.splice(index,1);

    renderOrder();
}

function renderOrder() {

    const list = document.getElementById("orderList");

    if(currentOrder.length === 0) {

        list.innerHTML =
            '<div class="empty">메뉴를 선택해주세요</div>';

    } else {

        list.innerHTML = currentOrder.map((item,index)=>{

            let detail = item.temp;

            if(item.discountPercent > 0) {

                if(detail) detail += " · ";

                detail += item.discount +
                    " " + item.discountPercent + "% 할인";
            }

            return `
            <div class="order-item">

                <div>
                    <div class="order-name">
                        ${item.name}
                    </div>

                    <div class="order-detail">
                        ${detail || "일반"}
                    </div>
                </div>

                <div style="display:flex;gap:10px;align-items:center">

                    <strong>
                        ${item.price.toLocaleString()}원
                    </strong>

                    <button class="remove"
                    onclick="removeOrder(${index})">
                        삭제
                    </button>

                </div>

            </div>
            `;

        }).join("");

    }

    const total =
        currentOrder.reduce((sum,item)=>sum+item.price,0);

    document.getElementById("total").innerText =
        total.toLocaleString()+"원";
}

function checkout() {

    if(currentOrder.length === 0) {
        alert("주문이 없습니다.");
        return;
    }

    const total =
        currentOrder.reduce((sum,item)=>sum+item.price,0);

    const db = getDatabase();

    const key = todayKey();

    if(!db[key]) db[key] = [];

    db[key].push({

        time:new Date().toLocaleTimeString("ko-KR",{
            hour:"2-digit",
            minute:"2-digit"
        }),

        total:total,

        items:[...currentOrder]

    });

    saveDatabase(db);

    currentOrder = [];

    renderOrder();

    updateToday();

    alert("주문이 완료되었습니다.");
}

function updateToday() {

    const db = getDatabase();

    const orders = db[todayKey()] || [];

    const sales =
        orders.reduce((sum,o)=>sum+o.total,0);

    document.getElementById("todaySales").innerText =
        sales.toLocaleString()+"원";

    const history =
        document.getElementById("historyList");

    if(orders.length === 0) {

        history.innerHTML =
            '<div class="empty">오늘 주문 기록이 없습니다</div>';

        return;
    }

    history.innerHTML =
        [...orders].reverse().map(order=>{

            const names =
                order.items.map(i=>
                    i.name + (i.temp ? " "+i.temp : "")
                ).join(", ");

            return `
            <div class="history-row">

                <div>
                    <strong>${names}</strong>

                    <div class="history-time">
                        ${order.time}
                    </div>
                </div>

                <strong>
                    ${order.total.toLocaleString()}원
                </strong>

            </div>
            `;

        }).join("");
}

function resetToday() {

    if(!confirm("오늘 주문 기록을 모두 삭제할까요?"))
        return;

    const db = getDatabase();

    delete db[todayKey()];

    saveDatabase(db);

    updateToday();
}

renderOrder();
updateToday();

</script>

</body>
</html>

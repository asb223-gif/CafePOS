<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>카페 POS</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #f2f3ef;
    color: #222;
}

button {
    font-family: inherit;
    cursor: pointer;
}

header {
    height: 82px;
    background: #20382c;
    color: white;
    padding: 0 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.sales {
    text-align: right;
}

.sales small {
    display: block;
    opacity: .7;
}

#todaySales {
    font-size: 27px;
    font-weight: 900;
}


/* =========================
   3단 레이아웃
========================= */

.main {
    width: 100%;
    padding: 15px;

    display: grid;

    grid-template-columns:
        minmax(210px, .75fr)
        minmax(320px, 1fr)
        minmax(380px, 1.35fr);

    gap: 14px;
    align-items: start;
}

.panel {
    background: white;
    border-radius: 18px;
    padding: 17px;
    box-shadow: 0 3px 14px rgba(0,0,0,.05);
}

.panel-title {
    margin: 0 0 15px;
    font-size: 20px;
    font-weight: 900;
}


/* =========================
   메뉴
========================= */

.menu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 9px;
}

.menu {
    width: 100%;
    min-height: 78px;
    border: 2px solid #e2e5e0;
    border-radius: 14px;
    background: white;
    padding: 14px;
    text-align: left;
}

.menu:active {
    transform: scale(.97);
    background: #e5eee8;
    border-color: #426a55;
}

.menu-name {
    font-size: 18px;
    font-weight: 900;
}

.menu-price {
    margin-top: 5px;
    font-size: 14px;
    color: #777;
}


/* =========================
   현재 주문
========================= */

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.order-header h2 {
    margin: 0;
    font-size: 20px;
}

#orderCount {
    color: #777;
    font-size: 13px;
}

.empty {
    color: #aaa;
    text-align: center;
    padding: 45px 10px;
}

.order-item {
    border: 2px solid #e8eae6;
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 10px;
}

.order-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.order-name {
    font-size: 17px;
    font-weight: 900;
}

.order-price {
    font-size: 18px;
    font-weight: 900;
    white-space: nowrap;
}

.hot-only {
    margin-top: 5px;
    font-size: 12px;
    color: #a0523f;
    font-weight: 800;
}

.label {
    margin: 11px 0 5px;
    color: #888;
    font-size: 11px;
    font-weight: 700;
}


/* ICE / HOT */

.temp-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.temp-btn {
    height: 41px;
    border: 2px solid #e0e3df;
    border-radius: 9px;
    background: #f8f9f7;
    font-size: 14px;
    font-weight: 900;
}

.temp-btn.ice.selected {
    background: #397ba9;
    border-color: #397ba9;
    color: white;
}

.temp-btn.hot.selected {
    background: #a75a47;
    border-color: #a75a47;
    color: white;
}


/* 할인 */

.discount-buttons {
    display: grid;
    grid-template-columns: .75fr 1.15fr 1.15fr;
    gap: 5px;
}

.discount-btn {
    min-height: 45px;
    padding: 4px;
    border: 2px solid #e0e3df;
    border-radius: 9px;
    background: #f8f9f7;
    font-size: 11px;
    font-weight: 900;
}

.discount-btn.selected {
    background: #294c39;
    border-color: #294c39;
    color: white;
}


/* 수량 */

.quantity-area {
    margin-top: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f4f5f2;
    border-radius: 11px;
    padding: 7px;
}

.quantity-label {
    padding-left: 5px;
    font-size: 12px;
    color: #777;
    font-weight: 700;
}

.quantity-control {
    display: flex;
    align-items: center;
    gap: 5px;
}

.qty-btn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 9px;
    background: white;
    font-size: 22px;
    font-weight: 700;
    box-shadow: 0 1px 5px rgba(0,0,0,.08);
}

.qty-number {
    min-width: 38px;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
}

.delete-btn {
    width: 100%;
    height: 34px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    background: #f6eaea;
    color: #9a3e3e;
    font-size: 12px;
    font-weight: 800;
}


/* =========================
   결제
========================= */

.total-area {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 2px solid #eee;
}

.total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 21px;
    font-weight: 900;
}

#total {
    font-size: 25px;
}

.checkout {
    width: 100%;
    height: 55px;
    margin-top: 13px;
    border: 0;
    border-radius: 13px;
    background: #17271f;
    color: white;
    font-size: 18px;
    font-weight: 900;
}


/* =========================
   주문 내역
========================= */

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.history-header h2 {
    margin: 0;
    font-size: 20px;
}

.reset {
    border: 0;
    border-radius: 8px;
    background: #eee;
    padding: 8px 10px;
    font-size: 11px;
    white-space: nowrap;
}


/* 주문 카드 */

.history-card {
    border: 2px solid #e7e9e5;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    transition: .2s;
}


/* 제조 대기 */

.history-card.pending {
    border-left: 6px solid #e19b38;
}


/* 제조 완료 */

.history-card.completed {
    background: #f4f5f3;
    border-color: #e5e7e3;
    opacity: .62;
}

.history-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
}

.history-time {
    font-size: 15px;
    font-weight: 900;
}

.history-total {
    font-size: 18px;
    font-weight: 900;
    white-space: nowrap;
}

.history-items {
    margin-top: 9px;
    color: #555;
    font-size: 13px;
    line-height: 1.8;
}


/* 제조 상태 */

.status-area {
    margin-top: 12px;
}

.status-btn {
    width: 100%;
    min-height: 45px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 900;
}


/* 대기 버튼 */

.status-btn.pending {
    background: #fff4df;
    border: 2px solid #e8a846;
    color: #8a5813;
}


/* 완료 버튼 */

.status-btn.completed {
    background: #dfe9e3;
    border: 2px solid #779584;
    color: #355844;
}


/* =========================
   알림
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    background: #17261f;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: .15s;
    z-index: 999;
}

.toast.show {
    opacity: 1;
}


/* =========================
   작은 화면
========================= */

@media(max-width: 950px) {

    .main {
        grid-template-columns: 1fr;
    }

    .menu-grid {
        grid-template-columns: repeat(3,1fr);
    }

    .menu {
        text-align: center;
    }
}

</style>
</head>


<body>

<header>

    <div class="logo">
        ☕ 카페 POS
    </div>

    <div class="sales">

        <small>오늘 총매출</small>

        <div id="todaySales">
            0원
        </div>

    </div>

</header>


<div class="main">


<!-- 메뉴 -->

<section class="panel">

    <h2 class="panel-title">
        메뉴
    </h2>

    <div class="menu-grid">

        <button
            class="menu"
            onclick="addItem('아메리카노',4000,true)">

            <div class="menu-name">
                ☕ 아메리카노
            </div>

            <div class="menu-price">
                4,000원
            </div>

        </button>


        <button
            class="menu"
            onclick="addItem('카페라떼',5000,true)">

            <div class="menu-name">
                🥛 카페라떼
            </div>

            <div class="menu-price">
                5,000원
            </div>

        </button>


        <button
            class="menu"
            onclick="addItem('한방차',9000,false)">

            <div class="menu-name">
                🍵 한방차
            </div>

            <div class="menu-price">
                9,000원 · HOT
            </div>

        </button>


        <button
            class="menu"
            onclick="addItem('캐모마일',5000,false)">

            <div class="menu-name">
                🌼 캐모마일
            </div>

            <div class="menu-price">
                5,000원 · HOT
            </div>

        </button>


        <button
            class="menu"
            onclick="addItem('페퍼민트',5000,false)">

            <div class="menu-name">
                🌿 페퍼민트
            </div>

            <div class="menu-price">
                5,000원 · HOT
            </div>

        </button>

    </div>

</section>


<!-- 현재 주문 -->

<section class="panel">

    <div class="order-header">

        <h2>
            현재 주문
        </h2>

        <span id="orderCount"></span>

    </div>


    <div id="orderList"></div>


    <div class="total-area">

        <div class="total">

            <span>
                결제금액
            </span>

            <span id="total">
                0원
            </span>

        </div>


        <button
            class="checkout"
            onclick="checkout()">

            주문 완료

        </button>

    </div>

</section>


<!-- 오늘 주문 내역 -->

<section class="panel">

    <div class="history-header">

        <h2>
            오늘 주문 내역
        </h2>

        <button
            class="reset"
            onclick="resetToday()">

            기록 초기화

        </button>

    </div>


    <div id="historyList"></div>

</section>


</div>


<div class="toast" id="toast"></div>


<script>

let currentOrder = [];


/* 날짜 */

function todayKey() {

    const d = new Date();

    return (
        d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0")
    );
}


/* 저장 */

function getDatabase() {

    try {

        return JSON.parse(
            localStorage.getItem("cafePOS") || "{}"
        );

    } catch {

        return {};
    }
}


function saveDatabase(db) {

    localStorage.setItem(
        "cafePOS",
        JSON.stringify(db)
    );
}


/* 메뉴 추가 */

function addItem(name,price,tempChoice) {

    if (!tempChoice) {

        const existing =
            currentOrder.find(item =>
                item.name === name &&
                item.temp === "HOT" &&
                item.discount === "normal"
            );

        if (existing) {

            existing.quantity++;

            renderOrder();

            showToast(name + " +1");

            return;
        }
    }


    if (tempChoice) {

        const existing =
            currentOrder.find(item =>
                item.name === name &&
                item.temp === "" &&
                item.discount === "normal"
            );

        if (existing) {

            existing.quantity++;

            renderOrder();

            showToast(name + " +1");

            return;
        }
    }


    currentOrder.push({

        name:name,

        basePrice:price,

        tempChoice:tempChoice,

        temp:
            tempChoice
            ? ""
            : "HOT",

        discount:"normal",

        quantity:1

    });


    renderOrder();

    showToast(name + " 추가");
}


/* 옵션 */

function setTemp(index,temp) {

    currentOrder[index].temp = temp;

    mergeSameItems();

    renderOrder();
}


function setDiscount(index,discount) {

    currentOrder[index].discount = discount;

    mergeSameItems();

    renderOrder();
}


/* 같은 옵션 합치기 */

function mergeSameItems() {

    const merged = [];


    currentOrder.forEach(item => {

        const existing =
            merged.find(x =>

                x.name === item.name &&
                x.temp === item.temp &&
                x.discount === item.discount

            );


        if (existing) {

            existing.quantity +=
                item.quantity;

        } else {

            merged.push({
                ...item
            });
        }

    });


    currentOrder = merged;
}


/* 할인 */

function discountRate(discount) {

    if (discount === "senior") {
        return .30;
    }

    if (discount === "family") {
        return .10;
    }

    return 0;
}


function discountName(discount) {

    if (discount === "senior") {
        return "55세 이상 30%";
    }

    if (discount === "family") {
        return "이웃가족 10%";
    }

    return "일반";
}


function singlePrice(item) {

    return Math.round(

        item.basePrice *
        (
            1 -
            discountRate(
                item.discount
            )
        )

    );
}


function itemTotal(item) {

    return (
        singlePrice(item) *
        item.quantity
    );
}


/* 수량 */

function increaseQty(index) {

    currentOrder[index].quantity++;

    renderOrder();
}


function decreaseQty(index) {

    if (
        currentOrder[index].quantity > 1
    ) {

        currentOrder[index].quantity--;

    } else {

        currentOrder.splice(index,1);
    }

    renderOrder();
}


function deleteItem(index) {

    currentOrder.splice(index,1);

    renderOrder();
}


/* 현재 주문 표시 */

function renderOrder() {

    const list =
        document.getElementById(
            "orderList"
        );


    const totalQuantity =
        currentOrder.reduce(

            (sum,item) =>
                sum + item.quantity,

            0
        );


    document.getElementById(
        "orderCount"
    ).textContent =

        totalQuantity
        ? totalQuantity + "잔"
        : "";


    if (
        currentOrder.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">메뉴를 눌러주세요</div>';

        document.getElementById(
            "total"
        ).textContent =
            "0원";

        return;
    }


    list.innerHTML =
        currentOrder
        .map((item,index) => {


            let tempHTML;


            if (item.tempChoice) {

                tempHTML = `

                <div class="label">
                    ICE / HOT
                </div>

                <div class="temp-buttons">

                    <button
                        class="temp-btn ice ${item.temp==="ICE" ? "selected" : ""}"
                        onclick="setTemp(${index},'ICE')">

                        🧊 ICE

                    </button>


                    <button
                        class="temp-btn hot ${item.temp==="HOT" ? "selected" : ""}"
                        onclick="setTemp(${index},'HOT')">

                        🔥 HOT

                    </button>

                </div>

                `;

            } else {

                tempHTML =
                    '<div class="hot-only">🔥 HOT 전용</div>';
            }


            return `

            <div class="order-item">


                <div class="order-top">

                    <div class="order-name">
                        ${item.name}
                    </div>

                    <div class="order-price">
                        ${itemTotal(item).toLocaleString()}원
                    </div>

                </div>


                ${tempHTML}


                <div class="label">
                    할인
                </div>


                <div class="discount-buttons">


                    <button
                        class="discount-btn ${item.discount==="normal" ? "selected" : ""}"
                        onclick="setDiscount(${index},'normal')">

                        일반

                    </button>


                    <button
                        class="discount-btn ${item.discount==="senior" ? "selected" : ""}"
                        onclick="setDiscount(${index},'senior')">

                        55세 이상<br>30%

                    </button>


                    <button
                        class="discount-btn ${item.discount==="family" ? "selected" : ""}"
                        onclick="setDiscount(${index},'family')">

                        이웃가족<br>10%

                    </button>

                </div>


                <div class="quantity-area">

                    <div class="quantity-label">
                        수량
                    </div>


                    <div class="quantity-control">

                        <button
                            class="qty-btn"
                            onclick="decreaseQty(${index})">

                            −

                        </button>


                        <div class="qty-number">
                            ${item.quantity}
                        </div>


                        <button
                            class="qty-btn"
                            onclick="increaseQty(${index})">

                            +

                        </button>

                    </div>

                </div>


                <button
                    class="delete-btn"
                    onclick="deleteItem(${index})">

                    항목 삭제

                </button>

            </div>

            `;

        })
        .join("");


    const total =
        currentOrder.reduce(

            (sum,item) =>
                sum + itemTotal(item),

            0
        );


    document.getElementById(
        "total"
    ).textContent =

        total.toLocaleString() +
        "원";
}


/* 주문 완료 */

function checkout() {

    if (
        currentOrder.length === 0
    ) {

        alert(
            "주문이 없습니다."
        );

        return;
    }


    const missing =
        currentOrder.find(

            item =>
                item.tempChoice &&
                !item.temp

        );


    if (missing) {

        alert(
            missing.name +
            "의 ICE / HOT을 선택해주세요."
        );

        return;
    }


    const total =
        currentOrder.reduce(

            (sum,item) =>
                sum + itemTotal(item),

            0
        );


    const savedItems =
        currentOrder.map(item => ({

            name:item.name,

            temp:item.temp,

            discount:item.discount,

            quantity:item.quantity,

            unitPrice:
                singlePrice(item),

            price:
                itemTotal(item)

        }));


    const db =
        getDatabase();


    const key =
        todayKey();


    if (!db[key]) {
        db[key] = [];
    }


    db[key].push({

        id:
            Date.now(),

        time:
            new Date()
            .toLocaleTimeString(
                "ko-KR",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            ),

        total:total,

        items:savedItems,

        /* 새 주문은 제조 대기 */
        completed:false

    });


    saveDatabase(db);


    currentOrder = [];


    renderOrder();

    updateToday();


    showToast(
        "주문 접수 ✓"
    );
}


/* =========================
   제조 완료 / 대기 전환
========================= */

function toggleCompleted(orderId) {

    const db =
        getDatabase();


    const key =
        todayKey();


    const orders =
        db[key] || [];


    const order =
        orders.find(
            item =>
                item.id === orderId
        );


    if (!order) {
        return;
    }


    order.completed =
        !order.completed;


    saveDatabase(db);

    updateToday();


    if (order.completed) {

        showToast(
            "제조 완료 ✓"
        );

    } else {

        showToast(
            "제조 대기로 변경"
        );
    }
}


/* =========================
   오늘 주문 내역
========================= */

function updateToday() {

    const db =
        getDatabase();


    const orders =
        db[todayKey()] || [];


    /*
    기존 버전에서 저장한 주문에는
    id / completed가 없을 수 있으므로
    자동으로 추가
    */

    let changed = false;


    orders.forEach(
        (order,index) => {

            if (!order.id) {

                order.id =
                    Date.now() +
                    index;

                changed = true;
            }


            if (
                typeof order.completed ===
                "undefined"
            ) {

                order.completed =
                    false;

                changed = true;
            }

        }
    );


    if (changed) {

        db[todayKey()] =
            orders;

        saveDatabase(db);
    }


    /* 총매출 */

    const sales =
        orders.reduce(

            (sum,order) =>
                sum + order.total,

            0
        );


    document.getElementById(
        "todaySales"
    ).textContent =

        sales.toLocaleString() +
        "원";


    const history =
        document.getElementById(
            "historyList"
        );


    if (
        orders.length === 0
    ) {

        history.innerHTML =

            '<div class="empty">' +
            '오늘 주문 기록이 없습니다' +
            '</div>';

        return;
    }


    /*
    제조 대기 먼저,
    완료된 주문은 아래로
    */

    const sortedOrders =
        [...orders].sort(
            (a,b) => {

                if (
                    a.completed ===
                    b.completed
                ) {

                    return b.id - a.id;
                }

                return (
                    a.completed
                    ? 1
                    : -1
                );
            }
        );


    history.innerHTML =
        sortedOrders
        .map(order => {


            const items =
                order.items
                .map(item => {


                    const qty =
                        item.quantity || 1;


                    let text =

                        "<strong>" +
                        item.name +
                        "</strong>" +

                        " · " +
                        item.temp;


                    if (
                        item.discount !==
                        "normal"
                    ) {

                        text +=

                            " · " +
                            discountName(
                                item.discount
                            );
                    }


                    if (qty > 1) {

                        text +=

                            " · " +
                            qty +
                            "잔";
                    }


                    text +=

                        " · " +
                        item.price
                        .toLocaleString() +
                        "원";


                    return text;

                })
                .join("<br>");


            const cardClass =
                order.completed
                ? "completed"
                : "pending";


            const buttonClass =
                order.completed
                ? "completed"
                : "pending";


            const buttonText =
                order.completed
                ? "✓ 제조 완료"
                : "○ 제조 대기 · 완료하려면 누르기";


            return `

            <div class="history-card ${cardClass}">


                <div class="history-top">

                    <div class="history-time">
                        ${order.time}
                    </div>


                    <div class="history-total">
                        ${order.total.toLocaleString()}원
                    </div>

                </div>


                <div class="history-items">

                    ${items}

                </div>


                <div class="status-area">

                    <button
                        class="status-btn ${buttonClass}"
                        onclick="toggleCompleted(${order.id})">

                        ${buttonText}

                    </button>

                </div>


            </div>

            `;

        })
        .join("");
}


/* 오늘 기록 초기화 */

function resetToday() {

    const answer =
        confirm(
            "오늘 주문 기록과 총매출을 모두 삭제할까요?"
        );


    if (!answer) {
        return;
    }


    const db =
        getDatabase();


    delete db[
        todayKey()
    ];


    saveDatabase(db);

    updateToday();
}


/* 알림 */

let toastTimer;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            700
        );
}


/* 시작 */

renderOrder();

updateToday();

</script>

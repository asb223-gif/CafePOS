<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>카페 POS</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #f3f4f1;
    color: #222;
}

button {
    font-family: inherit;
}

/* 상단 */
header {
    background: #21372c;
    color: white;
    padding: 20px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 26px;
    font-weight: 900;
}

.sales {
    text-align: right;
}

.sales small {
    display: block;
    opacity: .7;
    margin-bottom: 2px;
}

#todaySales {
    font-size: 28px;
    font-weight: 900;
}

/* 메인 */
.main {
    max-width: 1400px;
    margin: auto;
    padding: 18px;
    display: grid;
    grid-template-columns: 0.75fr 1.25fr;
    gap: 18px;
}

.panel {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,.05);
}

h2 {
    margin: 0 0 16px;
    font-size: 21px;
}

/* 메뉴 */
.menu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 11px;
}

.menu {
    width: 100%;
    border: 2px solid #e1e4df;
    border-radius: 16px;
    background: white;
    padding: 18px;
    text-align: left;
    cursor: pointer;
    min-height: 85px;
}

.menu:active {
    transform: scale(.98);
    background: #e4eee8;
    border-color: #416b54;
}

.menu-name {
    font-size: 19px;
    font-weight: 900;
}

.menu-price {
    color: #777;
    font-size: 16px;
    margin-top: 6px;
}

/* 현재 주문 */
.empty {
    color: #999;
    text-align: center;
    padding: 50px 10px;
}

.order-item {
    border: 2px solid #e8eae6;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 11px;
}

.order-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.order-name {
    font-size: 18px;
    font-weight: 900;
}

.order-price {
    font-size: 20px;
    font-weight: 900;
}

.hot-only {
    font-size: 13px;
    color: #a25340;
    font-weight: 800;
    margin-top: 5px;
}

.label {
    font-size: 12px;
    color: #888;
    margin: 12px 0 6px;
}

/* ICE HOT */
.temp-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.temp-btn {
    height: 46px;
    border: 2px solid #e0e3df;
    border-radius: 10px;
    background: #f8f9f7;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
}

.temp-btn.ice.selected {
    background: #3979a7;
    border-color: #3979a7;
    color: white;
}

.temp-btn.hot.selected {
    background: #a85844;
    border-color: #a85844;
    color: white;
}

/* 할인 */
.discount-buttons {
    display: grid;
    grid-template-columns: .7fr 1.15fr 1.15fr;
    gap: 7px;
}

.discount-btn {
    min-height: 50px;
    border: 2px solid #e0e3df;
    border-radius: 10px;
    background: #f8f9f7;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
}

.discount-btn.selected {
    background: #294b39;
    border-color: #294b39;
    color: white;
}

.delete-btn {
    width: 100%;
    margin-top: 11px;
    border: 0;
    border-radius: 9px;
    background: #f5e7e7;
    color: #9d3c3c;
    height: 37px;
    font-weight: 700;
    cursor: pointer;
}

/* 합계 */
.total-area {
    border-top: 2px solid #eee;
    margin-top: 18px;
    padding-top: 17px;
}

.total {
    display: flex;
    justify-content: space-between;
    font-size: 24px;
    font-weight: 900;
}

.checkout {
    width: 100%;
    margin-top: 15px;
    height: 58px;
    border: 0;
    border-radius: 14px;
    background: #18271f;
    color: white;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
}

/* 주문 내역 */
.history-wrap {
    max-width: 1400px;
    margin: 0 auto 30px;
    padding: 0 18px;
}

.history-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.reset {
    border: 0;
    border-radius: 9px;
    background: #eee;
    padding: 9px 12px;
    cursor: pointer;
}

.history-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
}

.history-items {
    color: #555;
    font-size: 14px;
    margin-top: 5px;
    line-height: 1.6;
}

/* 알림 */
.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    background: #17261f;
    color: white;
    border-radius: 30px;
    padding: 12px 22px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: .15s;
}

.toast.show {
    opacity: 1;
}

/* 아이패드 세로 */
@media(max-width: 850px) {
    .main {
        grid-template-columns: 1fr;
        padding: 12px;
    }

    .menu-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .menu {
        text-align: center;
        min-height: 90px;
        padding: 13px;
    }

    header {
        padding: 17px;
    }

    .logo {
        font-size: 21px;
    }

    #todaySales {
        font-size: 23px;
    }

    .history-wrap {
        padding: 0 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">☕ 카페 POS</div>

    <div class="sales">
        <small>오늘 총매출</small>
        <div id="todaySales">0원</div>
    </div>
</header>

<div class="main">

    <!-- 메뉴 -->
    <section class="panel">

        <h2>메뉴</h2>

        <div class="menu-grid">

            <button class="menu" onclick="addItem('아메리카노', 4000, true)">
                <div class="menu-name">☕ 아메리카노</div>
                <div class="menu-price">4,000원</div>
            </button>

            <button class="menu" onclick="addItem('카페라떼', 5000, true)">
                <div class="menu-name">🥛 카페라떼</div>
                <div class="menu-price">5,000원</div>
            </button>

            <button class="menu" onclick="addItem('한방차', 9000, false)">
                <div class="menu-name">🍵 한방차</div>
                <div class="menu-price">9,000원 · HOT</div>
            </button>

            <button class="menu" onclick="addItem('캐모마일', 5000, false)">
                <div class="menu-name">🌼 캐모마일</div>
                <div class="menu-price">5,000원 · HOT</div>
            </button>

            <button class="menu" onclick="addItem('페퍼민트', 5000, false)">
                <div class="menu-name">🌿 페퍼민트</div>
                <div class="menu-price">5,000원 · HOT</div>
            </button>

        </div>

    </section>


    <!-- 현재 주문 -->
    <section class="panel">

        <h2>
            현재 주문
            <span id="orderCount" style="color:#888;font-size:14px;"></span>
        </h2>

        <div id="orderList"></div>

        <div class="total-area">

            <div class="total">
                <span>결제금액</span>
                <span id="total">0원</span>
            </div>

            <button class="checkout" onclick="checkout()">
                주문 완료
            </button>

        </div>

    </section>

</div>


<!-- 오늘 주문 -->
<div class="history-wrap">

    <section class="panel">

        <div class="history-head">

            <h2>오늘 주문 내역</h2>

            <button class="reset" onclick="resetToday()">
                오늘 기록 초기화
            </button>

        </div>

        <div id="historyList"></div>

    </section>

</div>

<div class="toast" id="toast"></div>


<script>

let currentOrder = [];


/* 날짜 */

function todayKey() {
    const d = new Date();

    return (
        d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0")
    );
}


/* 저장 */

function getDatabase() {
    try {
        return JSON.parse(
            localStorage.getItem("cafePOS") || "{}"
        );
    } catch {
        return {};
    }
}

function saveDatabase(db) {
    localStorage.setItem(
        "cafePOS",
        JSON.stringify(db)
    );
}


/* 메뉴 클릭 */

function addItem(name, price, tempChoice) {

    currentOrder.push({
        name: name,
        basePrice: price,
        tempChoice: tempChoice,

        // 커피는 아직 선택 전
        // 차 종류는 HOT 자동 적용
        temp: tempChoice ? "" : "HOT",

        discount: "normal"
    });

    renderOrder();

    showToast(name + " 추가");
}


/* 온도 */

function setTemp(index, temp) {
    currentOrder[index].temp = temp;
    renderOrder();
}


/* 할인 */

function setDiscount(index, discount) {
    currentOrder[index].discount = discount;
    renderOrder();
}


function discountRate(discount) {

    if (discount === "senior") {
        return 0.30;
    }

    if (discount === "family") {
        return 0.10;
    }

    return 0;
}


function discountName(discount) {

    if (discount === "senior") {
        return "55세 이상 30% 할인";
    }

    if (discount === "family") {
        return "이웃가족 10% 할인";
    }

    return "일반";
}


function itemPrice(item) {

    return Math.round(
        item.basePrice *
        (1 - discountRate(item.discount))
    );
}


/* 메뉴 삭제 */

function deleteItem(index) {
    currentOrder.splice(index, 1);
    renderOrder();
}


/* 현재 주문 그리기 */

function renderOrder() {

    const list =
        document.getElementById("orderList");

    const count =
        document.getElementById("orderCount");


    count.textContent =
        currentOrder.length
        ? "(" + currentOrder.length + "잔)"
        : "";


    if (currentOrder.length === 0) {

        list.innerHTML =
            '<div class="empty">메뉴를 눌러 주문을 추가해주세요</div>';

        document.getElementById("total").textContent =
            "0원";

        return;
    }


    list.innerHTML =
        currentOrder.map((item, index) => {

            let tempHTML = "";

            if (item.tempChoice) {

                tempHTML = `
                    <div class="label">ICE / HOT</div>

                    <div class="temp-buttons">

                        <button
                            class="temp-btn ice ${item.temp === "ICE" ? "selected" : ""}"
                            onclick="setTemp(${index}, 'ICE')">
                            🧊 ICE
                        </button>

                        <button
                            class="temp-btn hot ${item.temp === "HOT" ? "selected" : ""}"
                            onclick="setTemp(${index}, 'HOT')">
                            🔥 HOT
                        </button>

                    </div>
                `;

            } else {

                tempHTML =
                    '<div class="hot-only">🔥 HOT 전용</div>';
            }


            return `
                <div class="order-item">

                    <div class="order-head">

                        <div>
                            <div class="order-name">
                                ${index + 1}. ${item.name}
                            </div>
                            ${!item.tempChoice ? '<div class="hot-only">HOT</div>' : ''}
                        </div>

                        <div class="order-price">
                            ${itemPrice(item).toLocaleString()}원
                        </div>

                    </div>


                    ${tempHTML}


                    <div class="label">할인</div>

                    <div class="discount-buttons">

                        <button
                            class="discount-btn ${item.discount === "normal" ? "selected" : ""}"
                            onclick="setDiscount(${index}, 'normal')">
                            일반
                        </button>

                        <button
                            class="discount-btn ${item.discount === "senior" ? "selected" : ""}"
                            onclick="setDiscount(${index}, 'senior')">
                            55세 이상<br>30%
                        </button>

                        <button
                            class="discount-btn ${item.discount === "family" ? "selected" : ""}"
                            onclick="setDiscount(${index}, 'family')">
                            이웃가족<br>10%
                        </button>

                    </div>


                    <button
                        class="delete-btn"
                        onclick="deleteItem(${index})">
                        이 메뉴 삭제
                    </button>

                </div>
            `;

        }).join("");


    const total =
        currentOrder.reduce(
            (sum, item) =>
                sum + itemPrice(item),
            0
        );


    document.getElementById("total").textContent =
        total.toLocaleString() + "원";
}


/* 주문 완료 */

function checkout() {

    if (currentOrder.length === 0) {
        alert("주문이 없습니다.");
        return;
    }


    // 아메리카노/라떼 ICE HOT 미선택 확인

    const missing =
        currentOrder.find(
            item =>
                item.tempChoice &&
                !item.temp
        );


    if (missing) {

        alert(
            missing.name +
            "의 ICE / HOT을 선택해주세요."
        );

        return;
    }


    const total =
        currentOrder.reduce(
            (sum, item) =>
                sum + itemPrice(item),
            0
        );


    const savedItems =
        currentOrder.map(item => ({
            name: item.name,
            temp: item.temp,
            discount: item.discount,
            price: itemPrice(item)
        }));


    const db = getDatabase();
    const key = todayKey();


    if (!db[key]) {
        db[key] = [];
    }


    db[key].push({

        time:
            new Date().toLocaleTimeString(
                "ko-KR",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            ),

        total: total,

        items: savedItems

    });


    saveDatabase(db);


    currentOrder = [];

    renderOrder();
    updateToday();

    showToast("주문 완료 ✓");
}


/* 오늘 매출 */

function updateToday() {

    const db = getDatabase();

    const orders =
        db[todayKey()] || [];


    const sales =
        orders.reduce(
            (sum, order) =>
                sum + order.total,
            0
        );


    document.getElementById("todaySales").textContent =
        sales.toLocaleString() + "원";


    const history =
        document.getElementById("historyList");


    if (orders.length === 0) {

        history.innerHTML =
            '<div class="empty">오늘 주문 기록이 없습니다</div>';

        return;
    }


    history.innerHTML =
        [...orders]
        .reverse()
        .map(order => {

            const items =
                order.items
                .map(item => {

                    let text =
                        item.name +
                        " " +
                        item.temp;

                    if (item.discount !== "normal") {
                        text +=
                            " · " +
                            discountName(item.discount);
                    }

                    text +=
                        " · " +
                        item.price.toLocaleString() +
                        "원";

                    return text;

                })
                .join("<br>");


            return `
                <div class="history-row">

                    <div>

                        <strong>${order.time}</strong>

                        <div class="history-items">
                            ${items}
                        </div>

                    </div>

                    <strong>
                        ${order.total.toLocaleString()}원
                    </strong>

                </div>
            `;

        })
        .join("");
}


/* 오늘 기록 삭제 */

function resetToday() {

    const answer =
        confirm(
            "오늘 주문 기록과 총매출을 모두 삭제할까요?"
        );


    if (!answer) {
        return;
    }


    const db = getDatabase();

    delete db[todayKey()];

    saveDatabase(db);

    updateToday();
}


/* 작은 알림 */

let toastTimer;

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {
            toast.classList.remove("show");
        }, 700);
}


/* 처음 실행 */

renderOrder();
updateToday();

</script>

</body>
</html>

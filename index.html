<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>카페 POS</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #f2f3ef;
    color: #222;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* =========================
   상단
========================= */

header {
    height: 82px;
    background: #20382c;
    color: white;
    padding: 0 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.sales {
    text-align: right;
}

.sales small {
    display: block;
    opacity: .7;
    margin-bottom: 2px;
}

#todaySales {
    font-size: 27px;
    font-weight: 900;
}


/* =========================
   3단 레이아웃
========================= */

.main {
    width: 100%;
    padding: 15px;

    display: grid;

    grid-template-columns:
        minmax(200px, .70fr)
        minmax(310px, .95fr)
        minmax(430px, 1.55fr);

    gap: 14px;

    align-items: start;
}

.panel {
    background: white;
    border-radius: 18px;
    padding: 17px;
    box-shadow: 0 3px 14px rgba(0,0,0,.05);
}

.panel-title {
    margin: 0 0 15px;
    font-size: 20px;
    font-weight: 900;
}


/* =========================
   메뉴
========================= */

.menu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 9px;
}

.menu {
    width: 100%;
    min-height: 78px;

    border: 2px solid #e2e5e0;
    border-radius: 14px;

    background: white;

    padding: 14px;

    text-align: left;

    transition: .08s;
}

.menu:active {
    transform: scale(.97);
    background: #e5eee8;
    border-color: #426a55;
}

.menu-name {
    font-size: 18px;
    font-weight: 900;
}

.menu-price {
    margin-top: 5px;
    font-size: 14px;
    color: #777;
}


/* =========================
   현재 주문
========================= */

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.order-header h2 {
    margin: 0;
    font-size: 20px;
}

#orderCount {
    color: #777;
    font-size: 13px;
}

.empty {
    color: #aaa;
    text-align: center;
    padding: 45px 10px;
}

.order-item {
    border: 2px solid #e8eae6;
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 10px;
}

.order-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.order-name {
    font-size: 17px;
    font-weight: 900;
}

.order-price {
    font-size: 18px;
    font-weight: 900;
    white-space: nowrap;
}

.hot-only {
    margin-top: 5px;
    font-size: 12px;
    color: #a0523f;
    font-weight: 800;
}

.label {
    margin: 11px 0 5px;
    color: #888;
    font-size: 11px;
    font-weight: 700;
}


/* =========================
   ICE / HOT
========================= */

.temp-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.temp-btn {
    height: 41px;
    border: 2px solid #e0e3df;
    border-radius: 9px;
    background: #f8f9f7;
    font-size: 14px;
    font-weight: 900;
}

.temp-btn.ice.selected {
    background: #397ba9;
    border-color: #397ba9;
    color: white;
}

.temp-btn.hot.selected {
    background: #a75a47;
    border-color: #a75a47;
    color: white;
}


/* =========================
   할인
========================= */

.discount-buttons {
    display: grid;
    grid-template-columns: .75fr 1.15fr 1.15fr;
    gap: 5px;
}

.discount-btn {
    min-height: 45px;
    padding: 4px;

    border: 2px solid #e0e3df;
    border-radius: 9px;

    background: #f8f9f7;

    font-size: 11px;
    font-weight: 900;
}

.discount-btn.selected {
    background: #294c39;
    border-color: #294c39;
    color: white;
}


/* =========================
   수량
========================= */

.quantity-area {
    margin-top: 11px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: #f4f5f2;

    border-radius: 11px;

    padding: 7px;
}

.quantity-label {
    padding-left: 5px;
    font-size: 12px;
    color: #777;
    font-weight: 700;
}

.quantity-control {
    display: flex;
    align-items: center;
    gap: 5px;
}

.qty-btn {
    width: 38px;
    height: 38px;

    border: 0;
    border-radius: 9px;

    background: white;

    font-size: 22px;
    font-weight: 700;

    box-shadow: 0 1px 5px rgba(0,0,0,.08);
}

.qty-number {
    min-width: 38px;
    text-align: center;
    font-size: 18px;
    font-weight: 900;
}

.delete-btn {
    width: 100%;
    height: 34px;

    margin-top: 8px;

    border: 0;
    border-radius: 8px;

    background: #f6eaea;
    color: #9a3e3e;

    font-size: 12px;
    font-weight: 800;
}


/* =========================
   결제
========================= */

.total-area {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 2px solid #eee;
}

.total {
    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 21px;
    font-weight: 900;
}

#total {
    font-size: 25px;
}

.checkout {
    width: 100%;
    height: 55px;

    margin-top: 13px;

    border: 0;
    border-radius: 13px;

    background: #17271f;
    color: white;

    font-size: 18px;
    font-weight: 900;
}


/* =========================
   제조 현황
========================= */

.production-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}

.production-header h2 {
    margin: 0;
    font-size: 20px;
}

.pending-count {
    background: #fff0d8;
    color: #9b6417;
    border-radius: 20px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 900;
}


/* =========================
   음료 카드 3칸
========================= */

.drink-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 9px;
}

.drink-card {
    min-width: 0;
    min-height: 125px;

    border: 2px solid #e5a340;
    border-radius: 13px;

    background: #fff7e9;

    padding: 11px 7px;

    text-align: center;

    cursor: pointer;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    transition: .12s;
}

.drink-card:active {
    transform: scale(.96);
}


/* 제조 완료 */

.drink-card.completed {
    background: #e3ebe6;
    border-color: #789586;
    opacity: .58;
}

.drink-name {
    width: 100%;

    font-size: 14px;
    font-weight: 900;

    overflow-wrap: anywhere;
}

.drink-temp {
    margin-top: 5px;
    font-size: 12px;
    font-weight: 900;
}

.drink-discount {
    margin-top: 6px;

    font-size: 9px;
    color: #777;

    line-height: 1.3;
}

.drink-time {
    margin-top: 6px;
    font-size: 9px;
    color: #999;
}

.drink-status {
    margin-top: 7px;

    font-size: 11px;
    font-weight: 900;

    color: #9a6418;
}

.drink-card.completed .drink-status {
    color: #3f6650;
}


/* =========================
   오른쪽 하단 버튼
========================= */

.production-bottom {
    margin-top: 15px;
    padding-top: 13px;
    border-top: 1px solid #eee;
}

.reset {
    width: 100%;
    height: 38px;

    border: 0;
    border-radius: 9px;

    background: #eee;

    color: #666;

    font-size: 11px;
    font-weight: 700;
}


/* =========================
   알림
========================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    background: #17261f;
    color: white;

    padding: 12px 22px;

    border-radius: 30px;

    font-weight: 800;

    opacity: 0;
    pointer-events: none;

    transition: .15s;

    z-index: 999;
}

.toast.show {
    opacity: 1;
}


/* =========================
   작은 화면
========================= */

@media(max-width: 950px) {

    .main {
        grid-template-columns: 1fr;
    }

    .menu-grid {
        grid-template-columns: repeat(3,1fr);
    }

    .menu {
        text-align: center;
    }

    .drink-grid {
        grid-template-columns: repeat(3,1fr);
    }
}


@media(max-width: 600px) {

    header {
        height: 70px;
        padding: 0 14px;
    }

    .logo {
        font-size: 19px;
    }

    #todaySales {
        font-size: 21px;
    }

    .main {
        padding: 9px;
    }

    .menu-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .drink-grid {
        grid-template-columns: repeat(3,1fr);
    }

    .panel {
        padding: 13px;
    }

    .drink-card {
        min-height: 110px;
        padding: 8px 4px;
    }

    .drink-name {
        font-size: 12px;
    }
}
</style>
</head>


<body>

<header>

    <div class="logo">
        ☕ 카페 POS
    </div>

    <div class="sales">

        <small>
            오늘 총매출
        </small>

        <div id="todaySales">
            0원
        </div>

    </div>

</header>


<div class="main">


<!-- =========================
     왼쪽 메뉴
========================= -->

<section class="panel">

    <h2 class="panel-title">
        메뉴
    </h2>

    <div class="menu-grid">


        <button
            class="menu"
            onclick="addItem('아메리카노',4000,true)"
        >

            <div class="menu-name">
                ☕ 아메리카노
            </div>

            <div class="menu-price">
                4,000원
            </div>

        </button>


        <button
            class="menu"
            onclick="addItem('카페라떼',5000,true)"
        >

            <div class="menu-name">
                🥛 카페라떼
            </div>

            <div class="menu-price">
                5,000원
            </div>

        </button>


        <button
            class="menu"
            onclick="addItem('한방차',9000,false)"
        >

            <div class="menu-name">
                🍵 한방차
            </div>

            <div class="menu-price">
                9,000원 · HOT
            </div>

        </button>


        <button
            class="menu"
            onclick="addItem('캐모마일',5000,false)"
        >

            <div class="menu-name">
                🌼 캐모마일
            </div>

            <div class="menu-price">
                5,000원 · HOT
            </div>

        </button>


        <button
            class="menu"
            onclick="addItem('페퍼민트',5000,false)"
        >

            <div class="menu-name">
                🌿 페퍼민트
            </div>

            <div class="menu-price">
                5,000원 · HOT
            </div>

        </button>


    </div>

</section>



<!-- =========================
     가운데 현재 주문
========================= -->

<section class="panel">

    <div class="order-header">

        <h2>
            현재 주문
        </h2>

        <span id="orderCount"></span>

    </div>


    <div id="orderList"></div>


    <div class="total-area">

        <div class="total">

            <span>
                결제금액
            </span>

            <span id="total">
                0원
            </span>

        </div>


        <button
            class="checkout"
            onclick="checkout()"
        >

            주문 완료

        </button>

    </div>

</section>



<!-- =========================
     오른쪽 제조 현황
========================= -->

<section class="panel">

    <div class="production-header">

        <h2>
            제조 현황
        </h2>

        <div
            class="pending-count"
            id="pendingCount"
        >
            대기 0잔
        </div>

    </div>


    <div id="productionList"></div>


    <div class="production-bottom">

        <button
            class="reset"
            onclick="resetToday()"
        >
            오늘 기록 초기화
        </button>

    </div>

</section>


</div>


<div
    class="toast"
    id="toast"
></div>



<script>

/* =========================
   현재 주문
========================= */

let currentOrder = [];


/* =========================
   날짜
========================= */

function todayKey() {

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(
            d.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            d.getDate()
        ).padStart(2,"0")
    );
}


/* =========================
   저장
========================= */

function getDatabase() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "cafePOS"
            ) || "{}"
        );

    } catch {

        return {};
    }
}


function saveDatabase(db) {

    localStorage.setItem(
        "cafePOS",
        JSON.stringify(db)
    );
}


/* =========================
   메뉴 추가
========================= */

function addItem(
    name,
    price,
    tempChoice
) {

    /*
    HOT 전용 메뉴
    같은 일반 주문이면 수량 증가
    */

    if (!tempChoice) {

        const existing =
            currentOrder.find(
                item =>
                    item.name === name &&
                    item.temp === "HOT" &&
                    item.discount === "normal"
            );


        if (existing) {

            existing.quantity++;

            renderOrder();

            showToast(
                name + " +1"
            );

            return;
        }
    }


    /*
    ICE/HOT 선택 메뉴
    아직 온도 미선택 항목이 있으면
    수량 증가
    */

    if (tempChoice) {

        const existing =
            currentOrder.find(
                item =>
                    item.name === name &&
                    item.temp === "" &&
                    item.discount === "normal"
            );


        if (existing) {

            existing.quantity++;

            renderOrder();

            showToast(
                name + " +1"
            );

            return;
        }
    }


    currentOrder.push({

        name:
            name,

        basePrice:
            price,

        tempChoice:
            tempChoice,

        temp:
            tempChoice
            ? ""
            : "HOT",

        discount:
            "normal",

        quantity:
            1

    });


    renderOrder();

    showToast(
        name + " 추가"
    );
}


/* =========================
   온도
========================= */

function setTemp(
    index,
    temp
) {

    currentOrder[index].temp =
        temp;

    mergeSameItems();

    renderOrder();
}


/* =========================
   할인
========================= */

function setDiscount(
    index,
    discount
) {

    currentOrder[index].discount =
        discount;

    mergeSameItems();

    renderOrder();
}


/* =========================
   같은 주문 합치기
========================= */

function mergeSameItems() {

    const merged = [];


    currentOrder.forEach(
        item => {

            const existing =
                merged.find(
                    x =>

                        x.name ===
                        item.name &&

                        x.temp ===
                        item.temp &&

                        x.discount ===
                        item.discount
                );


            if (existing) {

                existing.quantity +=
                    item.quantity;

            } else {

                merged.push({
                    ...item
                });
            }

        }
    );


    currentOrder =
        merged;
}


/* =========================
   할인율
========================= */

function discountRate(
    discount
) {

    if (
        discount === "senior"
    ) {

        return 0.30;
    }


    if (
        discount === "family"
    ) {

        return 0.10;
    }


    return 0;
}


/* =========================
   할인 이름
========================= */

function discountName(
    discount
) {

    if (
        discount === "senior"
    ) {

        return "55세 이상 30%";
    }


    if (
        discount === "family"
    ) {

        return "이웃가족 10%";
    }


    return "일반";
}


/* =========================
   한 잔 가격
========================= */

function singlePrice(
    item
) {

    return Math.round(

        item.basePrice *

        (
            1 -
            discountRate(
                item.discount
            )
        )

    );
}


/* =========================
   항목 총 가격
========================= */

function itemTotal(
    item
) {

    return (
        singlePrice(item) *
        item.quantity
    );
}


/* =========================
   수량 +
========================= */

function increaseQty(
    index
) {

    currentOrder[index]
        .quantity++;

    renderOrder();
}


/* =========================
   수량 -
========================= */

function decreaseQty(
    index
) {

    if (
        currentOrder[index]
        .quantity > 1
    ) {

        currentOrder[index]
            .quantity--;

    } else {

        currentOrder.splice(
            index,
            1
        );
    }


    renderOrder();
}


/* =========================
   항목 삭제
========================= */

function deleteItem(
    index
) {

    currentOrder.splice(
        index,
        1
    );

    renderOrder();
}


/* =========================
   현재 주문 표시
========================= */

function renderOrder() {

    const list =
        document.getElementById(
            "orderList"
        );


    const totalQuantity =
        currentOrder.reduce(

            (sum,item) =>
                sum +
                item.quantity,

            0
        );


    document.getElementById(
        "orderCount"
    ).textContent =

        totalQuantity
        ? totalQuantity + "잔"
        : "";


    if (
        currentOrder.length === 0
    ) {

        list.innerHTML =

            '<div class="empty">' +
            '메뉴를 눌러주세요' +
            '</div>';


        document.getElementById(
            "total"
        ).textContent =
            "0원";


        return;
    }


    list.innerHTML =

        currentOrder
        .map(
            (item,index) => {


                let tempHTML = "";


                if (
                    item.tempChoice
                ) {

                    tempHTML = `

                    <div class="label">
                        ICE / HOT
                    </div>


                    <div class="temp-buttons">


                        <button
                            class="
                                temp-btn
                                ice
                                ${
                                    item.temp === "ICE"
                                    ? "selected"
                                    : ""
                                }
                            "

                            onclick="
                                setTemp(
                                    ${index},
                                    'ICE'
                                )
                            "
                        >

                            🧊 ICE

                        </button>


                        <button
                            class="
                                temp-btn
                                hot
                                ${
                                    item.temp === "HOT"
                                    ? "selected"
                                    : ""
                                }
                            "

                            onclick="
                                setTemp(
                                    ${index},
                                    'HOT'
                                )
                            "
                        >

                            🔥 HOT

                        </button>


                    </div>

                    `;

                } else {

                    tempHTML = `

                    <div class="hot-only">
                        🔥 HOT 전용
                    </div>

                    `;
                }


                return `

                <div class="order-item">


                    <div class="order-top">


                        <div class="order-name">

                            ${item.name}

                        </div>


                        <div class="order-price">

                            ${
                                itemTotal(item)
                                .toLocaleString()
                            }원

                        </div>


                    </div>


                    ${tempHTML}


                    <div class="label">
                        할인
                    </div>


                    <div class="discount-buttons">


                        <button
                            class="
                                discount-btn
                                ${
                                    item.discount === "normal"
                                    ? "selected"
                                    : ""
                                }
                            "

                            onclick="
                                setDiscount(
                                    ${index},
                                    'normal'
                                )
                            "
                        >

                            일반

                        </button>


                        <button
                            class="
                                discount-btn
                                ${
                                    item.discount === "senior"
                                    ? "selected"
                                    : ""
                                }
                            "

                            onclick="
                                setDiscount(
                                    ${index},
                                    'senior'
                                )
                            "
                        >

                            55세 이상
                            <br>
                            30%

                        </button>


                        <button
                            class="
                                discount-btn
                                ${
                                    item.discount === "family"
                                    ? "selected"
                                    : ""
                                }
                            "

                            onclick="
                                setDiscount(
                                    ${index},
                                    'family'
                                )
                            "
                        >

                            이웃가족
                            <br>
                            10%

                        </button>


                    </div>


                    <div class="quantity-area">


                        <div class="quantity-label">
                            수량
                        </div>


                        <div class="quantity-control">


                            <button
                                class="qty-btn"

                                onclick="
                                    decreaseQty(
                                        ${index}
                                    )
                                "
                            >

                                −

                            </button>


                            <div class="qty-number">

                                ${item.quantity}

                            </div>


                            <button
                                class="qty-btn"

                                onclick="
                                    increaseQty(
                                        ${index}
                                    )
                                "
                            >

                                +

                            </button>


                        </div>


                    </div>


                    <button
                        class="delete-btn"

                        onclick="
                            deleteItem(
                                ${index}
                            )
                        "
                    >

                        항목 삭제

                    </button>


                </div>

                `;

            }
        )
        .join("");


    const total =
        currentOrder.reduce(

            (sum,item) =>
                sum +
                itemTotal(item),

            0
        );


    document.getElementById(
        "total"
    ).textContent =

        total.toLocaleString() +
        "원";
}


/* =========================
   주문 완료
========================= */

function checkout() {

    if (
        currentOrder.length === 0
    ) {

        alert(
            "주문이 없습니다."
        );

        return;
    }


    /* ICE/HOT 선택 확인 */

    const missing =
        currentOrder.find(

            item =>
                item.tempChoice &&
                !item.temp

        );


    if (missing) {

        alert(

            missing.name +
            "의 ICE / HOT을 선택해주세요."

        );

        return;
    }


    const total =
        currentOrder.reduce(

            (sum,item) =>
                sum +
                itemTotal(item),

            0
        );


    const savedItems =
        currentOrder.map(
            item => ({

                name:
                    item.name,

                temp:
                    item.temp,

                discount:
                    item.discount,

                quantity:
                    item.quantity,

                unitPrice:
                    singlePrice(item),

                price:
                    itemTotal(item)

            })
        );


    const db =
        getDatabase();


    const key =
        todayKey();


    if (!db[key]) {

        db[key] = [];
    }


    const orderId =
        Date.now();


    const drinks = [];


    /*
    수량이 3잔이면
    제조 카드도 3개 생성
    */

    savedItems.forEach(
        (item,itemIndex) => {


            const qty =
                item.quantity || 1;


            for (
                let i = 0;
                i < qty;
                i++
            ) {


                drinks.push({

                    id:
                        orderId +
                        "-" +
                        itemIndex +
                        "-" +
                        i,

                    name:
                        item.name,

                    temp:
                        item.temp,

                    discount:
                        item.discount,

                    completed:
                        false

                });

            }

        }
    );


    db[key].push({

        id:
            orderId,

        time:
            new Date()
            .toLocaleTimeString(
                "ko-KR",
                {
                    hour:
                        "2-digit",

                    minute:
                        "2-digit"
                }
            ),

        total:
            total,

        items:
            savedItems,

        drinks:
            drinks

    });


    saveDatabase(db);


    currentOrder = [];


    renderOrder();

    updateToday();


    showToast(
        "주문 접수 ✓"
    );
}


/* =========================
   음료 제조 상태 변경
========================= */

function toggleDrink(
    orderId,
    drinkId
) {

    const db =
        getDatabase();


    const key =
        todayKey();


    const orders =
        db[key] || [];


    const order =
        orders.find(
            order =>
                order.id === orderId
        );


    if (!order) {
        return;
    }


    const drink =
        order.drinks.find(
            drink =>
                drink.id === drinkId
        );


    if (!drink) {
        return;
    }


    /*
    클릭할 때마다
    대기 ↔ 완료
    */

    drink.completed =
        !drink.completed;


    saveDatabase(db);

    updateToday();


    if (
        drink.completed
    ) {

        showToast(
            drink.name +
            " 제조 완료 ✓"
        );

    } else {

        showToast(
            drink.name +
            " 제조 대기"
        );
    }
}


/* =========================
   오늘 매출 / 제조 현황
========================= */

function updateToday() {

    const db =
        getDatabase();


    const key =
        todayKey();


    const orders =
        db[key] || [];


    let changed =
        false;


    /*
    예전 버전으로 저장한
    주문도 자동 변환
    */

    orders.forEach(
        (order,orderIndex) => {


            if (!order.id) {

                order.id =
                    Date.now() +
                    orderIndex;

                changed =
                    true;
            }


            if (!order.drinks) {

                order.drinks =
                    [];


                if (
                    Array.isArray(
                        order.items
                    )
                ) {


                    order.items.forEach(
                        (item,itemIndex) => {


                            const qty =
                                item.quantity ||
                                1;


                            for (
                                let i = 0;
                                i < qty;
                                i++
                            ) {


                                order.drinks.push({

                                    id:
                                        order.id +
                                        "-" +
                                        itemIndex +
                                        "-" +
                                        i,

                                    name:
                                        item.name,

                                    temp:
                                        item.temp ||
                                        "HOT",

                                    discount:
                                        item.discount ||
                                        "normal",

                                    completed:
                                        false

                                });

                            }

                        }
                    );

                }


                changed =
                    true;
            }

        }
    );


    if (changed) {

        db[key] =
            orders;

        saveDatabase(db);
    }


    /* =====================
       총매출
    ===================== */

    const sales =
        orders.reduce(

            (sum,order) =>
                sum +
                Number(
                    order.total || 0
                ),

            0
        );


    document.getElementById(
        "todaySales"
    ).textContent =

        sales.toLocaleString() +
        "원";


    /* =====================
       음료 전부 모으기
    ===================== */

    let allDrinks =
        [];


    orders.forEach(
        order => {


            if (
                !Array.isArray(
                    order.drinks
                )
            ) {

                return;
            }


            order.drinks.forEach(
                drink => {


                    allDrinks.push({

                        ...drink,

                        orderId:
                            order.id,

                        orderTime:
                            order.time

                    });

                }
            );

        }
    );


    /* =====================
       제조 대기 수량
    ===================== */

    const pending =
        allDrinks.filter(
            drink =>
                !drink.completed
        ).length;


    document.getElementById(
        "pendingCount"
    ).textContent =

        "대기 " +
        pending +
        "잔";


    const production =
        document.getElementById(
            "productionList"
        );


    if (
        allDrinks.length === 0
    ) {

        production.innerHTML =

            '<div class="empty">' +
            '제조 대기 음료가 없습니다' +
            '</div>';

        return;
    }


    /*
    대기 음료 먼저
    완료 음료는 뒤로
    */

    allDrinks.sort(
        (a,b) => {


            if (
                a.completed ===
                b.completed
            ) {

                return 0;
            }


            return (
                a.completed
                ? 1
                : -1
            );

        }
    );


    /* =====================
       음료 카드 생성
    ===================== */

    production.innerHTML = `

        <div class="drink-grid">

            ${

                allDrinks
                .map(
                    drink => {


                        let discountText =
                            "";


                        if (
                            drink.discount ===
                            "senior"
                        ) {

                            discountText =
                                "55세 이상 30%";
                        }


                        if (
                            drink.discount ===
                            "family"
                        ) {

                            discountText =
                                "이웃가족 10%";
                        }


                        let tempText =
                            "";


                        if (
                            drink.temp ===
                            "ICE"
                        ) {

                            tempText =
                                "🧊 ICE";

                        } else {

                            tempText =
                                "🔥 HOT";
                        }


                        return `

                        <div
                            class="
                                drink-card
                                ${
                                    drink.completed
                                    ? "completed"
                                    : ""
                                }
                            "

                            onclick="
                                toggleDrink(
                                    ${drink.orderId},
                                    '${drink.id}'
                                )
                            "
                        >


                            <div class="drink-name">

                                ${drink.name}

                            </div>


                            <div class="drink-temp">

                                ${tempText}

                            </div>


                            ${
                                discountText
                                ?
                                `

                                <div class="drink-discount">

                                    ${discountText}

                                </div>

                                `
                                :
                                ""
                            }


                            <div class="drink-time">

                                ${drink.orderTime || ""}

                            </div>


                            <div class="drink-status">

                                ${
                                    drink.completed
                                    ? "✓ 제조 완료"
                                    : "● 제조 대기"
                                }

                            </div>


                        </div>

                        `;

                    }
                )
                .join("")

            }

        </div>

    `;
}


/* =========================
   오늘 기록 초기화
========================= */

function resetToday() {

    const answer =
        confirm(
            "오늘 주문 기록과 총매출을 모두 삭제할까요?"
        );


    if (!answer) {

        return;
    }


    const db =
        getDatabase();


    delete db[
        todayKey()
    ];


    saveDatabase(db);

    updateToday();


    showToast(
        "오늘 기록 초기화"
    );
}


/* =========================
   알림
========================= */

let toastTimer;


function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            700
        );
}


/* =========================
   시작
========================= */

renderOrder();

updateToday();

</script>

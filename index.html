<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>카페 POS</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f4f5f2;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", sans-serif;
}

/* 상단 */

header {
    background: #20382c;
    color: white;
    padding: 20px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 27px;
    font-weight: 900;
}

.sales {
    text-align: right;
}

.sales-label {
    font-size: 13px;
    opacity: .7;
}

.sales-money {
    font-size: 29px;
    font-weight: 900;
}


/* 전체 */

.main {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
    display: grid;
    grid-template-columns: .8fr 1.2fr;
    gap: 18px;
}

.panel {
    background: white;
    border-radius: 20px;
    padding: 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,.05);
}

h2 {
    margin: 0 0 17px;
    font-size: 21px;
}


/* 메뉴 */

.menu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 13px;
}

.menu-button {
    width: 100%;
    min-height: 105px;
    border: 2px solid #e1e4df;
    border-radius: 17px;
    background: white;
    padding: 20px;
    text-align: left;
    cursor: pointer;
}

.menu-button:active {
    transform: scale(.98);
    background: #e6efe9;
    border-color: #426b55;
}

.menu-name {
    font-size: 21px;
    font-weight: 900;
}

.menu-price {
    margin-top: 7px;
    font-size: 17px;
    color: #666;
    font-weight: 700;
}


/* 현재 주문 */

.empty {
    color: #999;
    text-align: center;
    padding: 60px 0;
}

.order-item {
    border: 2px solid #e8e9e6;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 12px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.order-name {
    font-size: 18px;
    font-weight: 900;
}

.order-price {
    font-size: 20px;
    font-weight: 900;
}

.option-section {
    margin-top: 13px;
}

.option-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
}

.button-row {
    display: flex;
    gap: 7px;
}

.option-button {
    flex: 1;
    min-height: 45px;
    border: 2px solid #e1e3df;
    border-radius: 10px;
    background: #f8f9f7;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

.option-button.selected {
    background: #294b39;
    color: white;
    border-color: #294b39;
}

.option-button.ice.selected {
    background: #326e9c;
    border-color: #326e9c;
}

.option-button.hot.selected {
    background: #a75542;
    border-color: #a75542;
}

.discount-row {
    display: grid;
    grid-template-columns: .7fr 1.15fr 1.15fr;
    gap: 7px;
}

.discount-button {
    min-height: 50px;
    padding: 5px;
    border: 2px solid #e1e3df;
    border-radius: 10px;
    background: #f8f9f7;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

.discount-button.selected {
    background: #294b39;
    border-color: #294b39;
    color: white;
}

.delete {
    margin-top: 12px;
    width: 100%;
    border: 0;
    border-radius: 9px;
    background: #f4e7e7;
    color: #a13e3e;
    padding: 9px;
    font-weight: 700;
    cursor: pointer;
}


/* 합계 */

.total-area {
    border-top: 2px solid #eee;
    margin-top: 20px;
    padding-top: 18px;
}

.total {
    display: flex;
    justify-content: space-between;
    font-size: 24px;
    font-weight: 900;
}

.checkout {
    width: 100%;
    border: 0;
    border-radius: 14px;
    margin-top: 17px;
    padding: 19px;
    background: #17261f;
    color: white;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
}


/* 주문 기록 */

.history-container {
    max-width: 1400px;
    margin: 0 auto 30px;
    padding: 0 20px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-row {
    padding: 14px 0;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.history-time {
    color: #999;
    font-size: 13px;
    margin-top: 4px;
}

.history-items {
    font-size: 14px;
    margin-top: 5px;
    color: #555;
}

.reset {
    border: 0;
    border-radius: 9px;
    padding: 9px 12px;
    background: #eee;
    cursor: pointer;
}


/* 작은 알림 */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    background: #17261f;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: .15s;
}

.toast.show {
    opacity: 1;
}


/* 아이패드 세로 / 휴대폰 */

@media(max-width:800px) {

    .main {
        grid-template-columns: 1fr;
        padding: 12px;
    }

    header {
        padding: 17px;
    }

    .logo {
        font-size: 21px;
    }

    .sales-money {
        font-size: 23px;
    }

    .menu-grid {
        grid-template-columns: repeat(3,1fr);
    }

    .menu-button {
        min-height: 90px;
        padding: 12px;
        text-align: center;
    }

    .menu-name {
        font-size: 16px;
    }

    .menu-price {
        font-size: 14px;
    }

    .panel {
        padding: 16px;
    }

    .history-container {
        padding: 0 12px;
    }
}
</style>
</head>


<body>

<header>

    <div class="logo">
        ☕ 카페 POS
    </div>

    <div class="sales">

        <div class="sales-label">
            오늘 총매출
        </div>

        <div class="sales-money" id="todaySales">
            0원
        </div>

    </div>

</header>


<div class="main">


<!-- 메뉴 -->

<div class="panel">

    <h2>메뉴</h2>

    <div class="menu-grid">

        <button class="menu-button"
        onclick="addItem('아메리카노',4000,true)">

            <div class="menu-name">
                ☕ 아메리카노
            </div>

            <div class="menu-price">
                4,000원
            </div>

        </button>


        <button class="menu-button"
        onclick="addItem('카페라떼',4500,true)">

            <div class="menu-name">
                🥛 카페라떼
            </div>

            <div class="menu-price">
                4,500원
            </div>

        </button>


        <button class="menu-button"
        onclick="addItem('한방차',9000,false)">

            <div class="menu-name">
                🍵 한방차
            </div>

            <div class="menu-price">
                9,000원
            </div>

        </button>

    </div>

</div>


<!-- 현재 주문 -->

<div class="panel">

    <h2>
        현재 주문
        <span id="orderCount"
        style="font-size:14px;color:#888">
        </span>
    </h2>

    <div id="orderList"></div>


    <div class="total-area">

        <div class="total">

            <span>결제금액</span>

            <span id="total">
                0원
            </span>

        </div>

        <button class="checkout"
        onclick="checkout()">

            주문 완료

        </button>

    </div>

</div>

</div>


<!-- 오늘 주문 기록 -->

<div class="history-container">

<div class="panel">

    <div class="history-header">

        <h2>오늘 주문 내역</h2>

        <button
        class="reset"
        onclick="resetToday()">

            오늘 기록 초기화

        </button>

    </div>

    <div id="historyList"></div>

</div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ===============================
   현재 주문
================================ */

let currentOrder = [];


/* ===============================
   날짜
================================ */

function todayKey() {

    const d = new Date();

    return (
        d.getFullYear() + "-" +
        String(d.getMonth()+1).padStart(2,"0") + "-" +
        String(d.getDate()).padStart(2,"0")
    );
}


/* ===============================
   저장
================================ */

function getDatabase() {

    try {

        return JSON.parse(
            localStorage.getItem("cafePOS") || "{}"
        );

    } catch {

        return {};
    }
}


function saveDatabase(db) {

    localStorage.setItem(
        "cafePOS",
        JSON.stringify(db)
    );
}


/* ===============================
   메뉴 추가
================================ */

function addItem(name, price, needsTemp) {

    /*
    메뉴를 누를 때마다 새로운 줄을 만듭니다.

    아메리카노 3번 클릭 =
    아메리카노 3개가 각각 독립적으로 생성됩니다.
    */

    currentOrder.push({

        name: name,

        basePrice: price,

        needsTemp: needsTemp,

        temp: "",

        discount: "normal"

    });

    renderOrder();

    showToast(name + " 추가");
}


/* ===============================
   ICE / HOT
================================ */

function setTemp(index, temp) {

    currentOrder[index].temp = temp;

    renderOrder();
}


/* ===============================
   할인
================================ */

function setDiscount(index, type) {

    currentOrder[index].discount = type;

    renderOrder();
}


function getDiscountRate(type) {

    if(type === "senior") {
        return 0.30;
    }

    if(type === "family") {
        return 0.10;
    }

    return 0;
}


function getDiscountName(type) {

    if(type === "senior") {
        return "55세 이상 30%";
    }

    if(type === "family") {
        return "이웃가족 10%";
    }

    return "일반";
}


function getPrice(item) {

    const rate =
        getDiscountRate(item.discount);

    return Math.round(
        item.basePrice * (1-rate)
    );
}


/* ===============================
   삭제
================================ */

function deleteItem(index) {

    currentOrder.splice(index,1);

    renderOrder();
}


/* ===============================
   현재 주문 표시
================================ */

function renderOrder() {

    const list =
        document.getElementById("orderList");

    const count =
        document.getElementById("orderCount");


    count.innerText =
        currentOrder.length > 0
        ? "(" + currentOrder.length + "잔)"
        : "";


    if(currentOrder.length === 0) {

        list.innerHTML =
        '<div class="empty">' +
        '왼쪽에서 메뉴를 눌러주세요' +
        '</div>';

        document.getElementById("total")
        .innerText = "0원";

        return;
    }


    list.innerHTML =
    currentOrder.map((item,index)=>{

        const price = getPrice(item);

        let temperatureButtons = "";


        /* 커피만 ICE/HOT 표시 */

        if(item.needsTemp) {

            temperatureButtons = `

            <div class="option-section">

                <div class="option-label">
                    ICE / HOT
                </div>

                <div class="button-row">

                    <button
                    class="option-button ice
                    ${item.temp==="ICE" ? "selected":""}"
                    onclick="setTemp(${index},'ICE')">

                        🧊 ICE

                    </button>


                    <button
                    class="option-button hot
                    ${item.temp==="HOT" ? "selected":""}"
                    onclick="setTemp(${index},'HOT')">

                        🔥 HOT

                    </button>

                </div>

            </div>

            `;
        }


        return `

        <div class="order-item">

            <div class="order-header">

                <div class="order-name">

                    ${index+1}.
                    ${item.name}

                </div>

                <div class="order-price">

                    ${price.toLocaleString()}원

                </div>

            </div>


            ${temperatureButtons}


            <div class="option-section">

                <div class="option-label">
                    할인
                </div>


                <div class="discount-row">


                    <button
                    class="discount-button
                    ${item.discount==="normal"
                    ? "selected":""}"

                    onclick="
                    setDiscount(${index},'normal')
                    ">

                        일반

                    </button>


                    <button
                    class="discount-button
                    ${item.discount==="senior"
                    ? "selected":""}"

                    onclick="
                    setDiscount(${index},'senior')
                    ">

                        55세 이상<br>
                        30% 할인

                    </button>


                    <button
                    class="discount-button
                    ${item.discount==="family"
                    ? "selected":""}"

                    onclick="
                    setDiscount(${index},'family')
                    ">

                        이웃가족<br>
                        10% 할인

                    </button>


                </div>

            </div>


            <button
            class="delete"
            onclick="deleteItem(${index})">

                이 메뉴 삭제

            </button>


        </div>

        `;

    }).join("");


    /* 총액 */

    const total =
    currentOrder.reduce(
        (sum,item)=>
        sum + getPrice(item),
        0
    );


    document.getElementById("total")
    .innerText =
        total.toLocaleString() + "원";
}


/* ===============================
   주문 완료
================================ */

function checkout() {

    if(currentOrder.length === 0) {

        alert("주문이 없습니다.");

        return;
    }


    /*
    커피인데 ICE/HOT을
    선택하지 않은 메뉴가 있는지 검사
    */

    const missingTemp =
    currentOrder.find(
        item =>
        item.needsTemp &&
        !item.temp
    );


    if(missingTemp) {

        alert(
            missingTemp.name +
            "의 ICE / HOT을 선택해주세요."
        );

        return;
    }


    const total =
    currentOrder.reduce(
        (sum,item)=>
        sum + getPrice(item),
        0
    );


    const savedItems =
    currentOrder.map(item=>({

        name: item.name,

        temp: item.temp,

        discount: item.discount,

        price: getPrice(item)

    }));


    const db = getDatabase();

    const key = todayKey();


    if(!db[key]) {

        db[key] = [];
    }


    db[key].push({

        time:
        new Date().toLocaleTimeString(
            "ko-KR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ),

        total: total,

        items: savedItems

    });


    saveDatabase(db);


    currentOrder = [];


    renderOrder();

    updateToday();


    showToast("주문 완료 ✓");
}


/* ===============================
   오늘 매출 / 주문내역
================================ */

function updateToday() {

    const db = getDatabase();

    const orders =
        db[todayKey()] || [];


    const sales =
    orders.reduce(
        (sum,order)=>
        sum + order.total,
        0
    );


    document.getElementById(
        "todaySales"
    ).innerText =
        sales.toLocaleString() + "원";


    const history =
        document.getElementById(
            "historyList"
        );


    if(orders.length === 0) {

        history.innerHTML =
        '<div class="empty">' +
        '오늘 주문 기록이 없습니다' +
        '</div>';

        return;
    }


    history.innerHTML =
    [...orders]
    .reverse()
    .map(order=>{

        const items =
        order.items
        .map(item=>{

            let text =
                item.name;

            if(item.temp) {

                text +=
                    " " +
                    item.temp;
            }

            if(item.discount !== "normal") {

                text +=
                    " · " +
                    getDiscountName(
                        item.discount
                    );
            }

            return (
                text +
                " " +
                item.price.toLocaleString() +
                "원"
            );

        })
        .join("<br>");


        return `

        <div class="history-row">

            <div>

                <strong>
                    ${order.time}
                </strong>

                <div class="history-items">
                    ${items}
                </div>

            </div>


            <strong>
                ${order.total.toLocaleString()}원
            </strong>

        </div>

        `;

    }).join("");
}


/* ===============================
   오늘 기록 초기화
================================ */

function resetToday() {

    if(
        !confirm(
            "오늘 주문 기록과 총매출을 모두 삭제할까요?"
        )
    ) {
        return;
    }


    const db = getDatabase();

    delete db[todayKey()];

    saveDatabase(db);

    updateToday();
}


/* ===============================
   알림
================================ */

let toastTimer;


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.innerText = message;

    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer =
    setTimeout(()=>{

        toast.classList.remove("show");

    },700);
}


/* 시작 */

renderOrder();

updateToday();

</script>

</body>
</html>
